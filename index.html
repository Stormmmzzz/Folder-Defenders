*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:var(--arrow)}
button,.row{cursor:var(--hand)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font:18px VT323,"Courier New",monospace}
body{background:radial-gradient(ellipse 150% 55% at 25% 112%,#5cb22a 0 62%,#3f8f14 63%,transparent 64%),linear-gradient(#1c5bd0,#5aa2ee 55%,#b4daf8 85%)}
.ic{display:inline-block;flex:none;background:var(--sp) no-repeat;image-rendering:pixelated}
#win{position:fixed;left:6px;right:6px;top:calc(6px + env(safe-area-inset-top,0px));bottom:calc(38px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;border:3px solid #0831d9;border-top:0;border-radius:8px 8px 0 0;background:#ece9d8;box-shadow:0 6px 0 #0004}
#tb{height:28px;flex:none;background:linear-gradient(#3b8bf6,#0a5be0 10%,#0453d8 70%,#0449c0);color:#fff;font-size:20px;display:flex;align-items:center;gap:6px;padding:0 5px 0 8px;border-radius:7px 7px 0 0;text-shadow:1px 1px #0008;white-space:nowrap;overflow:hidden}
#ttl{flex:1;overflow:hidden;text-overflow:ellipsis}
#tb .b{width:21px;height:21px;border:1px solid #fff;border-radius:3px;background:linear-gradient(#5b9cf8,#2663d8);text-align:center;line-height:18px;font-size:16px;flex:none}
#tb .x{background:linear-gradient(#e8845c,#c0391a)}
#mn{flex:none;display:flex;gap:12px;padding:2px 8px;border-bottom:1px solid #aca899;overflow:hidden;white-space:nowrap}
#addr{flex:none;display:flex;gap:6px;padding:3px 4px;border-bottom:1px solid #aca899;align-items:center;color:#555}
#ad{flex:1;background:#fff;border:1px solid #7f9db9;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#000}
#body{flex:1;position:relative;min-height:0;background:#fff;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#sb{flex:none;border-top:1px solid #aca899;padding:3px 6px 4px;font-size:17px}
#info{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
#ms{display:flex;gap:6px}.m{flex:1;min-width:0}.m span{display:block;white-space:nowrap;overflow:hidden;line-height:15px}
.m i{display:block;height:9px;border:1px solid #7f9db9;background:#fff}.m b{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#2fa82f 0 6px,#fff 6px 8px)}
.m.bad b{background:repeating-linear-gradient(90deg,#d83a2a 0 6px,#fff 6px 8px)}
#bar{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(#3168d5,#245edb 10%,#2159cf 85%,#1941a5);z-index:50}
#bi{display:flex;height:34px;align-items:center}
#start{height:34px;padding:0 16px 0 10px;border:0;border-radius:0 14px 14px 0;background:linear-gradient(#5db95a,#3c9a3a 50%,#2f8a2c);color:#fff;font:italic 26px VT323,monospace;text-shadow:1px 1px 2px #000a;box-shadow:inset 0 2px 3px #fff6}
.task{height:26px;padding:0 12px;margin-left:8px;background:#1e52b7;border-radius:3px;color:#fff;display:flex;align-items:center;gap:6px;box-shadow:inset 1px 1px 3px #0008}
#clk{margin-left:auto;height:34px;background:linear-gradient(#1290e8,#0f7ad8);border-left:1px solid #0b3da0;display:flex;align-items:center;padding:0 12px;color:#fff}
@media(max-width:420px){.task{display:none}}
.pop{position:absolute;width:225px;background:#ece9d8;border:2px solid #0a3fd4;border-radius:7px 7px 0 0;z-index:20;box-shadow:3px 3px 0 #0005}
.pop h5{margin:0;font-weight:400;background:linear-gradient(#3b8bf6,#0453d8);color:#fff;padding:2px 4px 2px 8px;display:flex;justify-content:space-between;align-items:center;font-size:19px;text-shadow:1px 1px #0008}
.pop h5 span{width:20px;height:20px;background:linear-gradient(#e8845c,#c0391a);border:1px solid #fff;border-radius:3px;text-align:center;line-height:17px;font-size:16px}
.pop p{margin:8px;line-height:1.1}
.ft{display:flex;gap:6px;justify-content:center;padding:0 8px 8px}
.pop button{min-width:70px;min-height:30px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#ece9d8);font:18px VT323,monospace}
.pop.c{left:50%;top:50%;transform:translate(-50%,-50%);width:min(300px,94%);max-height:96%;overflow-y:auto;z-index:30}
#rl{padding:4px 6px;display:flex;flex-direction:column;gap:3px}
.pop button.row{display:flex;align-items:center;gap:8px;text-align:left;padding:2px 6px;width:100%;line-height:1}
.row small{display:block;font-size:16px;color:#335}.row.no{opacity:.45}
#wv{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:25;pointer-events:none;text-align:center;background:#0b2a8a99;color:#fff;text-shadow:3px 3px 0 #000}
#wv.on{display:flex;animation:wv 2.8s forwards}#wv b{font-size:64px;font-weight:400;line-height:1}#wv span{font-size:26px}
@keyframes wv{0%{opacity:0;transform:scale(2.2)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#bs{position:fixed;inset:0;z-index:200;background:#0000a8;color:#d0d0ff;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-size:23px;line-height:1.1}
#bs.on{display:flex}#bs em{background:#c0c0c8;color:#0000a8;font-style:normal;padding:0 18px;margin-bottom:22px;font-size:28px}#bs p{max-width:480px;margin:9px 0}
.dk #win,.dk .pop{background:#2b2b33;color:#ddd}.dk #body{background:#1c1c24}.dk #ad{background:#15151b;color:#ddd;border-color:#555}.dk #sb,.dk #mn,.dk #addr{border-color:#444}.dk .pop button{background:#3a3a46;color:#ddd;border-color:#777}.dk .row small{color:#99a}.dk .m i{background:#15151b;border-color:#555}.dk #addr{color:#aaa}.lk{cursor:var(--hand);text-decoration:underline;color:#0a3fd4}.dk .lk{color:#8ab4ff}
.st{padding:2px 2px 4px}.st b{display:block;font-weight:400}.st div{display:flex;gap:3px;flex-wrap:wrap}.pop .st button{min-width:0;min-height:28px;padding:0 8px}.pop .st button.on{background:#316ac5;color:#fff}
#al{position:absolute;top:14%;left:0;right:0;display:none;text-align:center;z-index:24;pointer-events:none;color:#fff;font-size:30px;padding:2px 6px;text-shadow:2px 2px 0 #000}#al.on{display:block;animation:al 2.4s forwards}
@keyframes al{0%{opacity:0;transform:translateY(-14px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#win.hot{animation:hot .5s infinite}@keyframes hot{50%{box-shadow:0 0 0 5px #f00,0 0 28px 8px #f00}}.m.blink span{animation:bl .4s infinite}@keyframes bl{50%{background:#f00;color:#fff}}
#m5 b{background:repeating-linear-gradient(90deg,#316ac5 0 6px,#fff 6px 8px)}
.ur{padding:3px 4px;border-bottom:1px solid #aca899;line-height:1}.ur small{display:block;font-size:16px;color:#335}.dk .ur small{color:#99a}
.pop.ad{width:236px}.adb{background:#fff;text-align:center;padding:6px;color:#000;line-height:1}.dk .pop.ad .adb{color:#000}
.adb h3{margin:0;font-weight:700;font-size:36px;color:#c8171e;font-family:Georgia,serif;line-height:.85}.adb .big{font-size:34px;color:#e02020;margin:4px 0}.adb .sub{font-size:20px;margin:4px 0}
.burst{display:inline-block;background:#ff0;clip-path:polygon(50% 0,61% 12%,75% 6%,78% 21%,93% 25%,87% 39%,100% 50%,87% 61%,93% 75%,78% 79%,75% 94%,61% 88%,50% 100%,39% 88%,25% 94%,22% 79%,7% 75%,13% 61%,0 50%,13% 39%,7% 25%,22% 21%,25% 6%,39% 12%);padding:24px 22px;font-size:26px;color:#000;line-height:.95}
.pop button.adr{display:block;width:100%;min-height:32px;border:0;border-radius:0;background:#e02020;color:#fff;font-size:21px}
@keyframes fl{50%{opacity:.3}}.blk{animation:fl 1s infinite}
#bt{white-space:pre-wrap;text-align:left;max-width:480px;font-size:21px;line-height:1.1;min-height:200px}#bh p{margin:6px 0}.hs{color:#ff0;font-size:30px;animation:hsf 1.8s infinite}@keyframes hsf{50%{opacity:.2}}

 DIFF.forEach((d,i)=>{const b=document.createElement('button');b.className='row';const s=document.createElement('span');s.innerHTML=d.n+(i===ST.diff?' (last)':'')+'<small>Enemies x'+d.c+'  HP x'+d.e+'  start '+d.s+' GB  score x'+(1+.25*i)+'</small>';b.append(s);b.onclick=()=>{ST.diff=i;save();el.remove();reset(1)};el.querySelector('#rl').append(b)})}
function wp(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-OX)/S,y:(e.clientY-r.top-OY)/S}}
cv.onpointerdown=e=>{const p=wp(e);if(G.zplace){const z=G.zplace,c=30+z.items.reduce((a,k)=>a+T[k].cost,0);G.zplace=null;if(dist(p,G.f[0])>=34&&G.sto>=c){G.sto-=c;G.zips.push({x:p.x,y:p.y,items:z.items,hp:60,max:60,team:0,life:30});say('Zip Bomb armed: '+z.items.length+' files inside')}return}
 if(G.place){G.place=false;if(dist(p,G.f[0])>=34&&G.sta>=60){G.sta-=60;G.mines.push({x:p.x,y:p.y,arm:1});say('Trash Bin armed')}return}
 if(dist(p,G.f[0])<34)return deploy();
 for(const i of [1,2])if(dist(p,G.f[i])<34)return say(G.f[i].n+' ('+['neutral','yours','virus','malware'][G.f[i].team+1]+'): '+['+2.5 GB/s storage','+2 stamina/s'][i-1]+' when yours');
 const u=G.units.find(u=>dist(u,p)<18);
 if(u&&u===G.lt&&u.team===0&&e.timeStamp-G.ltt<400){u.hp=0;fx({t:'txt',x:u.x,y:u.y-14,s:'DELETED',c:'#d02a1a',life:.9});G.info=null;G.lt=null;return}
 G.lt=u||null;G.ltt=e.timeStamp;G.info=u||null};
cv.onpointermove=e=>{const p=wp(e);cv.style.cursor=dist(p,G.f[0])<34||G.units.some(u=>dist(u,p)<18)?'var(--hand)':'var(--arrow)'};
$('#start').onclick=deploy;
function rs(){const dp=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dp;cv.height=h*dp;S=Math.min(w/W,h/H);OX=(w-W*S)/2;OY=(h-H*S)/2}
new ResizeObserver(rs).observe($('#body'));
function tx(t,x,y,c){cx.font='15px VT323,monospace';cx.lineWidth=3;cx.strokeStyle=ST.dark?'#000':'#fff';cx.strokeText(t,x,y);cx.fillStyle=c;cx.fillText(t,x,y)}
function bar(x,y,w,v,c){cx.fillStyle='#0007';cx.fillRect(x-w/2,y,w,4);cx.fillStyle=c;cx.fillRect(x-w/2,y,w*Math.max(0,v),4)}
function spr(k,x,y,s){if(im.complete)cx.drawImage(im,IC.indexOf(k==='BOSS'?'vir':k)*64,0,64,64,x-s/2,y-s/2,s,s)}
function beam(o,c){if(o.fx>0&&o.ft){cx.strokeStyle=c;cx.lineWidth=2;cx.beginPath();cx.moveTo(o.x,o.y);cx.lineTo(o.ft.x,o.ft.y);cx.stroke()}}
function draw(){const dp=devicePixelRatio||1;cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);cx.setTransform(dp*S,0,0,dp*S,dp*OX,dp*OY);
 const sh=G.shake||0;cx.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);cx.fillStyle=ST.dark?'#1c1c24':'#f4f8ff';cx.fillRect(-20,-20,W+40,H+40);cx.fillStyle=ST.dark?'#222a48':'#e3edff';cx.fillRect(0,0,120,H);cx.fillStyle=ST.dark?'#3b2326':'#ffe9e5';cx.fillRect(360,0,120,H);
 cx.textAlign='center';
 for(const q of G.f){const c=q.team<0?'#888':COL[q.team];beam(q,c);
  if(q.max===0&&ST.rings){cx.strokeStyle=c;cx.lineWidth=2;cx.setLineDash([4,3]);cx.beginPath();cx.arc(q.x,q.y,32,0,7);cx.stroke();cx.setLineDash([]);
   if(q.prog>0){cx.strokeStyle='#e8a000';cx.lineWidth=3;cx.beginPath();cx.arc(q.x,q.y,36,-1.57,-1.57+q.prog/100*6.283);cx.stroke()}}
  spr(q.k,q.x,q.y,q===G.f[3]||q===G.f[0]?52:44);tx(q.n+(q.max?'':q===G.f[1]?' [+DISK]':' [+STAM]'),q.x,q.y+40,c);if(q.max)bar(q.x,q.y+44,54,q.hp/q.max,c)}
 for(const z of G.zips){spr('zip',z.x,z.y,30);if(ST.rings){cx.strokeStyle='#1fa81f';cx.lineWidth=2;cx.setLineDash([3,3]);cx.beginPath();cx.arc(z.x,z.y,22,0,7);cx.stroke();cx.setLineDash([])}tx('ZIP x'+z.items.length,z.x,z.y+28,'#1d5fd6');bar(z.x,z.y+31,26,z.life/30,'#1fa81f')}
 for(const m of G.mines){spr('bin',m.x,m.y,26);if(ST.rings){cx.strokeStyle='#d02a1a';cx.lineWidth=2;cx.setLineDash([3,3]);cx.beginPath();cx.arc(m.x,m.y,m.arm>0?20:34,0,7);cx.stroke();cx.setLineDash([])}if(m.arm>0)tx('ARMING',m.x,m.y+26,'#d02a1a')}
 for(const u of G.units)if(u.k==='PNG'&&ST.rings){cx.fillStyle=COL[u.team]+'22';cx.strokeStyle=COL[u.team]+'aa';cx.lineWidth=2;cx.setLineDash([5,4]);cx.beginPath();cx.arc(u.x,u.y,50,0,7);cx.fill();cx.stroke();cx.setLineDash([])}
 for(const u of G.units){beam(u,COL[u.team]);spr(u.k,u.x,u.y,u.boss?56:28);if(ST.rings&&u.k!=='PNG'&&G.units.some(p=>p.k==='PNG'&&p.team===u.team&&dist(p,u)<50)){cx.strokeStyle='#1d7fe0';cx.lineWidth=2;cx.beginPath();cx.arc(u.x,u.y,16,0,7);cx.stroke()}if(u.boss||nmShow(u))tx(u.nm.length>13&&!u.boss?u.nm.slice(0,12)+'~':u.nm,u.x,u.y+(u.boss?38:26),COL[u.team]);bar(u.x,u.y-(u.boss?34:21),u.boss?50:24,u.hp/u.max,u.boss?'#d02a1a':'#2fa82f');
  if(u===G.info){cx.strokeStyle='#e8a000';cx.lineWidth=2;cx.setLineDash([3,2]);cx.strokeRect(u.x-16,u.y-17,32,32);cx.setLineDash([])}}
 for(const e of G.fx){const k=e.life/e.max;cx.globalAlpha=Math.min(1,k*1.5);
  if(e.t==='ring'){if(ST.rings){cx.strokeStyle=e.c;cx.lineWidth=3;cx.beginPath();cx.arc(e.x,e.y,e.r*(1-k)+3,0,7);cx.stroke()}}
  else if(e.t==='boom'){cx.fillStyle='#f5a000';cx.beginPath();cx.arc(e.x,e.y,36*(1-k)+4,0,7);cx.fill();cx.fillStyle='#fff3a0';cx.beginPath();cx.arc(e.x,e.y,20*(1-k),0,7);cx.fill()}
  else tx(e.s,e.x,e.y-(1-k)*14,e.c);cx.globalAlpha=1}}
function mt(id,t,v,bad){const e=$(id);e.firstChild.textContent=t;e.lastChild.firstChild.style.width=Math.min(100,v*100)+'%';e.classList.toggle('bad',!!bad)}

 const i=G.info;$('#info').textContent=i?(nmShow(i)?i.nm:i.k+' file')+'  HP '+Math.ceil(i.hp)+'/'+Math.ceil(i.max)+'  DMG '+T[i.k].dmg+'  '+T[i.k].role+(i.team===0?'  (double-tap: delete)':''):'Wave '+G.wave+' - '+(G.left+G.units.filter(u=>u.wv).length)+' enemies left'+(G.pause?' (paused)':'');
 $('#ad').textContent=G.mt>0?G.msg:'C:\\WINDOWS\\System32';$('#ttl').textContent='System32 - '+COMP[(G.lv-1)%6]+' - '+G.dm.n}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(!G.over&&!G.pause&&!G.wait&&!$('#sp,#ug,#uv,#zp')){const k=Math.ceil(ST.speed);for(let i=0;i<k&&!G.over;i++)upd(dt*ST.speed/k)}if(G.shake>0)G.shake=Math.max(0,G.shake-dt*25);draw();hud();requestAnimationFrame(loop)}
